<!doctype html><html lang="he" dir="rtl"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>עדכון Hoek</title><style>body{font:18px system-ui;background:#f4f2f6;color:#0d1021;margin:0;padding:24px}main{max-width:520px;margin:10vh auto;background:white;padding:28px;border-radius:20px}button,a{display:block;background:#6b317f;color:white;border:0;border-radius:12px;padding:16px;margin:20px 0;text-align:center;font:inherit;text-decoration:none}p{line-height:1.7}small{color:#66536f}[hidden]{display:none}</style><main><small>HOEK · עדכון 03.10.2026</small><h1>עדכון האפליקציה</h1><p>העדכון מרענן את קובצי האפליקציה. התכנון, ההערות והאייקונים שבחרת נשארים שמורים במכשיר.</p><button id="start">עדכון עכשיו</button><p id="status" role="status">נדרש חיבור לאינטרנט.</p><a id="open" href="./?updated=20261003" hidden>פתיחת האפליקציה המעודכנת</a></main><script>
const status=document.querySelector('#status'),start=document.querySelector('#start');
function version(worker){return new Promise(resolve=>{if(!worker)return resolve(null);const ch=new MessageChannel(),timer=setTimeout(()=>resolve(null),1500);ch.port1.onmessage=e=>{clearTimeout(timer);resolve(e.data.version)};worker.postMessage({type:'VERSION'},[ch.port2]);})}
start.onclick=async()=>{start.disabled=true;status.textContent='מוריד את קובצי העדכון…';try{if(!('serviceWorker'in navigator))throw Error('הדפדפן אינו תומך בעדכון אופליין');const response=await fetch('sw.js?check='+Date.now(),{cache:'no-store'});if(!response.ok)throw Error('אין חיבור לשרת העדכון');const source=await response.text(),expected=source.match(/version:"(hoek-[a-f0-9]+)"/)[1];const reg=await navigator.serviceWorker.register('sw.js',{updateViaCache:'none'});await reg.update();const deadline=Date.now()+90000;let ready=false;while(Date.now()<deadline){if(await version(reg.active)===expected){ready=true;break;}if(reg.installing?.state==='redundant')throw Error('ההורדה לא הושלמה. נסו שוב.');await new Promise(r=>setTimeout(r,500));}if(!ready)throw Error('העדכון מתעכב. נסו שוב עם חיבור יציב.');status.textContent='העדכון הושלם. גרסת Ribbon 3.9.5 מוכנה.';document.querySelector('#open').hidden=false;start.hidden=true;}catch(e){status.textContent=e.message;start.disabled=false;}};
</script></html>
